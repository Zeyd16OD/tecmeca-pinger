name: Keepalive

# Les workflows planifies GitHub sont desactives apres 60 jours SANS activite
# du depot. Ce job mensuel pousse un petit commit pour garder le depot actif,
# et donc les pings eux aussi actifs.

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit d'activite
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > keepalive.txt
          git config user.name "tecmeca-pinger-bot"
          git config user.email "tecmeca-pinger-bot@users.noreply.github.com"
          git add keepalive.txt
          git commit -m "keepalive $(date -u +%F)" || echo "nothing to commit"
          git push